<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Ezra Song</title>
    <meta
      name="description"
      content="Ezra Song, software engineer. Two ways in: a straightforward portfolio, or a playable 3D Seoul."
    />
    <link rel="canonical" href="https://ezrasong.github.io/" />
    <meta name="author" content="Ezra Song" />
    <meta name="theme-color" content="#171615" />
    <meta name="color-scheme" content="dark" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ezrasong.github.io/" />
    <meta property="og:title" content="Ezra Song" />
    <meta property="og:description" content="Two ways in: a straightforward portfolio, or a playable 3D Seoul." />
    <meta property="og:image" content="https://ezrasong.github.io/og.png" />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23171615'/%3E%3Crect x='6' y='13' width='5' height='5' fill='%23e9e5dc'/%3E%3Crect x='12' y='13' width='5' height='5' fill='%23e9e5dc'/%3E%3Crect x='18' y='13' width='5' height='5' fill='%2377726a'/%3E%3Crect x='14' y='7' width='5' height='5' fill='%23e9e5dc'/%3E%3C/svg%3E"
    />
  </head>
  <body class="page page--chooser">
    <canvas class="ocean" data-ocean aria-hidden="true"></canvas>

    <header class="bar bar--top">
      <span class="mark">ezra song</span>
      <span class="bar__aside dim">software engineer</span>
    </header>

    <main class="chooser" data-content>
      <h1 class="chooser__title">Two ways in.</h1>
      <p class="chooser__sub">Same work, two builds. Each side has a way back.</p>
      <ol class="choices">
        <li>
          <a class="choice" href="./portfolio.html">
            <kbd class="choice__key">1</kbd>
            <span class="choice__name">portfolio</span>
            <span class="choice__desc">the straightforward tour of the work</span>
          </a>
        </li>
        <li>
          <a class="choice" href="./seoul.html">
            <kbd class="choice__key">2</kbd>
            <span class="choice__name">mini seoul</span>
            <span class="choice__desc">drive a poro through a voxel Seoul, knock on doors to open the work</span>
          </a>
        </li>
      </ol>
    </main>

    <footer class="bar bar--foot bar--fixed">
      <p class="dim"><span class="kbd-hint">press 1 or 2</span></p>
      <p class="dim foot__hint" data-hint>tap open water to feed the orca</p>
    </footer>

    <script type="module" src="/src/chooser.ts"></script>
  </body>
</html>
